<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mix &amp; Seek 프로토타입</title>
<style>
:root{--bg:#F7F6F2;--text-primary:#1F1E1C;--text-secondary:#5F5E5A;--text-muted:#888780;--text-danger:#C0392B;--surface-1:#ECEAE3;--border:rgba(0,0,0,0.12);--border-strong:rgba(0,0,0,0.28);--border-accent:#2A6FDB;--radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--text-primary:#EDECE8;--text-secondary:#B4B2A9;--text-muted:#888780;--text-danger:#F09595;--surface-1:#242422;--border:rgba(255,255,255,0.12);--border-strong:rgba(255,255,255,0.28);--border-accent:#85B7EB}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text-primary);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body.dev{overflow:auto;touch-action:auto}
button{font:inherit;color:var(--text-primary);background:transparent;border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 12px;cursor:pointer}
#root{max-width:520px;height:100vh;height:100dvh;margin:0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;position:relative}
body.dev #root{height:auto}
#stat .big{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:15px}
#stat .big b{font-size:19px;font-weight:600}
#stat .muted{color:var(--text-muted);font-size:13px}
#stat .small{font-size:11px;color:var(--text-secondary);margin-top:2px}
#boardWrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
body.dev #boardWrap{height:min(92vw,480px);flex:none}
#fld{display:block;touch-action:none}
.row{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
#handRow{justify-content:center;min-height:52px;margin-top:8px}
.hand{touch-action:none;width:52px;height:52px;flex:none;border-radius:10px;border:3px solid transparent;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0;user-select:none;-webkit-user-select:none}
.er{background:#141414;color:#FFFFFF;border:3px solid var(--border-strong)!important;margin-left:2px}
.hand.on{border-color:var(--text-primary)}
#bRef{height:52px;padding:0 8px;font-size:11px;line-height:1.3;flex:none}
#bCollect,#bNext,#bRetry{height:52px;padding:0 20px;font-size:15px;font-weight:600}
#msg{font-size:13px;line-height:1.45;height:56px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#info{background:var(--surface-1);border-radius:var(--radius);padding:6px 10px;font-size:12px}
.mx{display:inline-flex;align-items:center;gap:2px;margin:1px 8px 1px 0;font-size:11px;color:var(--text-secondary)}
.sq{width:12px;height:12px;border-radius:3px;display:inline-block}
.blk{background:#141414;border:1px solid var(--border-strong)}
#mix div[style]{display:none}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;border-top:1px solid var(--border);padding-top:4px}
.lab{font-size:12px;color:var(--text-secondary)}
#done{display:inline-flex;flex-wrap:wrap;gap:2px 8px}
#done .fr{display:inline-flex;align-items:center;gap:3px;margin:0}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
#found{display:inline}
#found > div:first-child{display:inline;margin:0!important}
#found .fr,#found .lab,#found > div:not(:first-child){display:none}
.tools{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;display:none}
.tools .row{flex-wrap:wrap;margin-bottom:8px}
.tools input{width:64px}
.zb{min-width:0;padding:4px 10px}
.sel{border:2px solid var(--border-accent)!important}
#ghost{position:absolute;width:52px;height:52px;border-radius:9px;pointer-events:none;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:600;opacity:0.92;border:2px solid #FFFFFF;z-index:5}
#guideBtn{position:absolute;top:8px;right:12px;width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;font-weight:700;z-index:4;background:var(--surface-1)}
#guide{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;overflow-y:auto;touch-action:pan-y}
#guide.show{display:block}
.gIn{max-width:460px;margin:0 auto;padding:16px 18px 28px;text-align:center}
.gIn h2{font-size:22px;margin:0 0 6px}
.gBig{font-size:18px;line-height:1.5;margin:0 0 10px}
.gTop{display:flex;align-items:center;justify-content:center;gap:8px}
.gBoard{width:62%;max-width:260px;display:block}
.gZoom{width:30%;max-width:130px;display:block}
.gNote{font-size:15px;line-height:1.5;color:var(--text-secondary);margin:6px 0 10px}
.gRow{display:flex;gap:10px}
.gCard{flex:1;background:var(--surface-1);border-radius:var(--radius);padding:10px}
.gCard svg{width:100%;display:block}
.gCard p{font-size:15px;line-height:1.45;margin:6px 0 0}
.gMix{font-size:15px;margin:12px 0;display:flex;align-items:center;justify-content:center;gap:4px}
.gMix .sq{width:18px;height:18px;border-radius:4px;display:inline-block}
#guideClose{font-size:18px;font-weight:700;padding:12px 40px;margin-top:4px}

.fly{position:absolute;z-index:6;pointer-events:none;transition:transform .5s cubic-bezier(.5,0,.75,0),opacity .5s}
#scoreNum{display:inline-block}
.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45);color:#F2C12E}100%{transform:scale(1)}}
#bCollect{background:#F2C12E;color:#1F1E1C;border-color:#F2C12E}

.gPair{display:flex;gap:10px}
.gB{flex:1}
.gB svg{width:100%;display:block}
.gB p{font-size:15px;line-height:1.4;margin:6px 0 0}

</style>
</head>
<body>
<div id="root">
<div id="stat"></div>
<div id="boardWrap"><svg id="fld" viewBox="-0.1 -0.1 7.2 7.2"></svg></div>
<div class="row" id="handRow"><div class="hand" id="h0"></div><div class="hand" id="h1"></div><div class="hand" id="h2"></div><div class="hand er" id="er">지우개</div><button id="bRef" style="display:none">바꾸기<br>(타일 1개)</button><button id="bCollect" style="display:none">확인</button><button id="bNext" style="display:none">다음 구역</button><button id="bRetry" style="display:none">다시 하기</button></div>
<div id="msg"></div>
<div id="info"><div id="mix"></div><div class="line"><span class="lab">색</span><span id="done"></span><span class="lab">찾은 보석</span><span id="found"></span></div></div>
<div id="rec" style="display:none"></div>
<div class="tools" id="devTools">
<div class="row"><span class="lab">구역 바로 가기</span><span id="zbs" style="display:flex;flex-wrap:wrap;gap:6px"></span></div>
<div class="row"><span class="lab">테스트 도구</span><button id="bUndo">되돌리기</button><button id="bShow">정답 보기</button><button id="bSame">이 구역 처음부터</button><button id="bNew">새 게임</button><button id="bAdd">타일 +5</button></div>
<div class="row"><span class="lab">리프레시 버튼</span><button class="zb" id="rOn">켬</button><button class="zb" id="rOff">끔</button></div>
<div class="row"><span class="lab">값</span><label class="lab">판 크기 <input id="iG" type="number" min="5" max="9" step="1" value="7"></label><label class="lab">시작 타일 <input id="iS" type="number" min="1" max="99" step="1" value="10"></label></div>
<div id="sch" style="font-size:12px;color:var(--text-secondary);margin-bottom:6px"></div>
<div id="log" style="font-size:12px;color:var(--text-secondary)"></div>
</div>
<button id="guideBtn" aria-label="규칙 보기">?</button>
<div id="guide">
<div class="gIn">

function startZone(newLayout){collected=false;collecting=false;selCell=null;const sp=spec(zone);if(newLayout)gems=place(sp.n,sp.nc);else gems.forEach(g=>g.f=false);cell={};conf=new Set();mv=[];order=[];flash=[];vanish=[];tiles=zoneStart;score=scoreStart;phase='play';burned=0;reveal=false;hist=[];stats={placed:0,found:0,gain:0};

 msg(`${zone}구역 · 숨은 보석 ${gems.length}개.`+(sp.nc&&zone>1?` 새 색: ${NAME[sp.nc]} 보석이 이번 구역에 적어도 하나 있습니다.`:zone>1?'':' 타일을 끌어 칸에 놓으세요. 숫자는 그쪽에 같은 색 보석이 몇 개 있는지 알려 줍니다.')+` 보석을 찾으면 타일 ${sched(zone).gain}개를 받습니다.`);draw();}

{const el=$('er');
 el.addEventListener('pointerdown',e=>{if(phase!=='play')return;e.preventDefault();el.setPointerCapture(e.pointerId);drag={er:true,sx:e.clientX,sy:e.clientY,mv:false};const gh=$('ghost');gh.style.display='flex';gh.style.background='#141414';gh.style.color='#FFFFFF';gh.textContent='지우개';moveGhost(e,LIFT);});
 el.addEventListener('pointermove',e=>{if(drag)moveGhost(e,LIFT);});
 el.addEventListener('pointerup',()=>{if(!drag)return;const t=target;drag=null;target=null;$('ghost').style.display='none';if(t)eraseAt(t.x,t.y);else{msg('판 밖에서 놓아 지우개가 제자리로 돌아갔습니다.');draw();}});
 el.addEventListener('pointercancel',()=>{drag=null;target=null;$('ghost').style.display='none';draw();});}
$('bRef').onclick=()=>{if(phase!=='play')return;hist.push(snap());tiles--;hand=Array.from({length:HN},draw1);hs=0;stats.ref=(stats.ref||0)+1;mv.push('리프레시');const parts=['손 타일 세 개를 새로 받았습니다. 타일 1개를 썼습니다.'];lostCheck(parts);msg(parts.join(' '),phase==='lost');draw();};
$('rOn').onclick=()=>{REF=true;draw();};$('rOff').onclick=()=>{REF=false;draw();};
$('bNext').onclick=()=>{zoneStart=tiles;scoreStart=score;zone++;startZone(true);};
$('bRetry').onclick=()=>jump(1);
$('bUndo').onclick=()=>{const h=hist.pop();if(!h){msg('되돌릴 수가 없습니다.',true);return;}cell=h.cell;gems.forEach((g,i)=>g.f=h.f[i]);tiles=h.tiles;score=h.score;phase=h.phase;burned=h.burned;stats=h.stats;order=h.order;hand=h.hand;hs=h.hs;conf=new Set(h.conf);mv=h.mv;rec=h.rec;flash=[];vanish=[];msg('한 수 되돌렸습니다.');draw();};
$('bNew').onclick=()=>jump(1);
$('bSame').onclick=()=>startZone(false);
$('bShow').onclick=()=>{reveal=!reveal;draw();};
$('bAdd').onclick=()=>{hist.push(snap());tiles+=5;if(phase==='lost'&&live().length)phase='play';msg('테스트용으로 타일 5개를 더했습니다.');draw();};
$('fld').addEventListener('click',e=>{if(phase!=='play')return;const c=cellAt(e.clientX,e.clientY);if(!c)return;const k=K(c.x,c.y);selCell=cell[k]&&selCell!==k?k:null;draw();});
function guide(on){$('guide').classList.toggle('show',on);}
$('guideBtn').onclick=()=>guide(true);$('guideClose').onclick=()=>{guide(false);try{localStorage.setItem('ms_guide','1')}catch(e){}};
try{if(!localStorage.getItem('ms_guide'))guide(true);}catch(e){guide(true);}
function collect(){if(collecting||collected)return;collecting=true;draw();const list=done().filter(g=>!g.col);const root=$('root'),rr=root.getBoundingClientRect();let i=0;
 const step=()=>{if(i>=list.length){setTimeout(()=>{collecting=false;collected=true;msg(`보석 ${list.length}개를 모았습니다. +${list.length*10}점. 남은 타일 ${tiles}개로 다음 구역에 갑니다.`);draw();},420);return;}
  const g=list[i++],fr=$('fld').getBoundingClientRect(),u=fr.width/(G+0.2),sx=fr.left+(g.x+0.6)*u-rr.left,sy=fr.top+(g.y+0.6)*u-rr.top,sc=$('scoreNum').getBoundingClientRect(),tx=sc.left+sc.width/2-rr.left,ty=sc.top+sc.height/2-rr.top,w=u*0.74;
  g.col=true;draw();const f=document.createElement('div');f.className='fly';f.style.width=w+'px';f.style.height=w+'px';f.style.left=(sx-w/2)+'px';f.style.top=(sy-w/2)+'px';f.innerHTML=`<svg viewBox="0 0 1 1" width="100%" height="100%">${gem(0.5,0.52,1,FILL[g.c],'#FFFFFF',0.06)}</svg>`;root.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(0.35)`;f.style.opacity='0.9';}));
  setTimeout(()=>{f.remove();score+=10;draw();const n=$('scoreNum');n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');},520);setTimeout(step,260);};
 step();}
$('bCollect').onclick=collect;
function fit(){const w=$('boardWrap'),sz=Math.max(120,Math.floor(Math.min(w.clientWidth,w.clientHeight)));$('fld').style.width=sz+'px';$('fld').style.height=sz+'px';}
window.addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
jump(1);fit();setTimeout(fit,300);
</script>
