<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Mix & Seek</title><style>:root{--bg:#F7F6F2;--text-primary:#1F1E1C;--text-secondary:#5F5E5A;--text-muted:#888780;--text-danger:#C0392B;--surface-1:#ECEAE3;--surface-2:#FFFFFF;--border:rgba(0,0,0,0.12);--border-strong:rgba(0,0,0,0.28);--accent:#2A6FDB;--radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--text-primary:#EDECE8;--text-secondary:#B4B2A9;--text-muted:#888780;--text-danger:#F09595;--surface-1:#242422;--surface-2:#2C2C2A;--border:rgba(255,255,255,0.12);--border-strong:rgba(255,255,255,0.28);--accent:#85B7EB}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text-primary);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body.dev{overflow:auto;touch-action:auto}
button{font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 12px;cursor:pointer}
button:disabled{opacity:0.4;cursor:default}
button.primary{background:#F2C12E;color:#1F1E1C;border-color:#F2C12E;font-weight:700}
#root{max-width:min(680px,100vw);height:100vh;height:100dvh;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;position:relative}
body.dev #root{height:auto}
#top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#stat{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:16px}
#stat b{font-size:21px;font-weight:700}
#stat .muted{color:var(--text-muted);font-size:15px}
#topBtns{display:flex;gap:6px;flex:none}
#guideBtn{width:38px;height:38px;border-radius:50%;padding:0;font-size:18px;font-weight:700}
#mixBtn{height:38px;padding:0 10px;font-size:15px}
#gemRow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-height:28px}
#gemRow .gIco{width:26px;height:26px}
#gemRow .gCnt{font-size:18px;margin-left:8px}
#gemRow .gCnt b{font-size:22px}
#boardWrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
body.dev #boardWrap{height:min(92vw,560px);flex:none}
#fld{display:block;touch-action:none}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.9);background:rgba(20,20,20,0.88);color:#FFFFFF;font-size:22px;font-weight:700;padding:14px 22px;border-radius:14px;text-align:center;line-height:1.4;word-break:keep-all;width:max-content;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#modeBar{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#2A6FDB;color:#FFFFFF;font-size:15px;font-weight:700;padding:6px 14px;border-radius:20px;display:none;pointer-events:none}
#bag{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
#bag .chip{font-size:15px;padding:6px 10px;border-radius:16px;background:var(--surface-2)}
#bag .eff{font-size:14px;padding:5px 9px;border-radius:16px;background:transparent;border:1px dashed var(--border-strong);color:var(--text-secondary)}
.row{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
#handRow{justify-content:center;min-height:60px;margin-top:4px}
.hand{touch-action:none;width:min(60px,calc((min(680px,100vw) - 124px)/5));height:min(60px,calc((min(680px,100vw) - 124px)/5));flex:none;cursor:grab;display:flex;align-items:center;justify-content:center;position:relative;user-select:none;-webkit-user-select:none;color:#FFFFFF}
.hand .hdia{position:absolute;inset:0;width:100%;height:100%}
.hand span{position:relative;font-size:14px;font-weight:700}
.hand.on .hdia polygon{stroke:var(--text-primary);stroke-width:0.07}
#bRef{height:52px;padding:0 6px;font-size:12px;line-height:1.3;flex:none}
#bCollect{height:56px;padding:0 34px;font-size:18px;font-weight:700;background:#F2C12E;color:#1F1E1C;border-color:#F2C12E}
.pop,.full{position:fixed;inset:0;z-index:20;display:none}
.pop{background:rgba(0,0,0,0.55);align-items:center;justify-content:center}
.pop.show{display:flex}
.popIn{background:var(--bg);border-radius:16px;padding:18px 20px;min-width:270px;max-width:92vw;text-align:center}
.popIn h3{font-size:19px;margin:2px 0 12px}
.popClose{font-size:16px;padding:8px 28px;margin-top:12px}
.mx{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;font-size:20px;color:var(--text-secondary)}
.sq{width:34px;height:34px;border-radius:8px;display:inline-block}
#pickList,#peekList{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickC{width:64px;height:64px;border-radius:12px;color:#FFFFFF;font-weight:700;font-size:15px;border:none}
.peekRow{display:flex;align-items:center;gap:10px;font-size:17px;width:100%;justify-content:center}
.peekRow .sq{width:26px;height:26px}
.full{background:var(--bg);overflow-y:auto;touch-action:pan-y}
.full.show{display:block}
.fIn{max-width:520px;margin:0 auto;padding:18px 16px 30px}
.fIn.center{text-align:center;padding-top:30vh}
.fIn h2{font-size:26px;margin:0 0 10px}
.fIn p{font-size:18px;line-height:1.6;color:var(--text-secondary)}
.shopHead{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:700;margin-bottom:6px}
.shopHead .money{font-size:18px;font-weight:400}
.shopHead .money b{font-size:26px;color:#C79A00}
.shopNext{font-size:16px;color:var(--text-secondary);margin-bottom:12px}
.tileSlot{display:flex;justify-content:space-between;align-items:center;background:var(--surface-1);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.tileSlot div{display:flex;flex-direction:column;gap:2px}
.tileSlot span{font-size:15px;color:var(--text-secondary)}
.tileSlot button{font-size:17px;padding:10px 18px;font-weight:700}
.item{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item .txt{flex:1}
.item .nm{font-size:18px;font-weight:700}
.item .tag{font-size:13px;padding:2px 8px;border-radius:10px;margin-left:6px;background:var(--surface-1);color:var(--text-secondary);font-weight:400;vertical-align:2px}
.item .ds{font-size:15px;line-height:1.45;color:var(--text-secondary);margin-top:4px}
.item button{font-size:17px;font-weight:700;padding:10px 14px;flex:none}
.item.sold{opacity:0.45}
.shopRow{display:flex;gap:10px;margin-top:6px}
.shopRow button{flex:1;font-size:17px;padding:12px}
.shopBag{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.6}
.tools{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;display:none;font-size:13px}
.tools .trow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tools button{padding:4px 10px;font-size:13px}
#ghost{position:absolute;width:60px;height:60px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);pointer-events:none;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;opacity:0.92;z-index:15}
.fly{position:absolute;z-index:16;pointer-events:none;transition:transform .5s cubic-bezier(.5,0,.75,0),opacity .5s}
.bump{display:inline-block;animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45);color:#C79A00}100%{transform:scale(1)}}
#guideBtnOld{display:none}
#guide{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow-y:auto;touch-action:pan-y}
#guide.show{display:block}
.gIn{max-width:460px;margin:0 auto;padding:16px 18px 28px;text-align:center}
.gIn h2{font-size:22px;margin:0 0 6px}
.gBig{font-size:18px;line-height:1.5;margin:0 0 10px}
.gNote{font-size:15px;line-height:1.5;color:var(--text-secondary);margin:6px 0 10px}
.gPair{display:flex;gap:10px}
.gB{flex:1}
.gB svg{width:100%;display:block}
.gB p{font-size:15px;line-height:1.4;margin:6px 0 0}
.gRow{display:flex;gap:10px}
.gCard{flex:1;background:var(--surface-1);border-radius:var(--radius);padding:10px}
.gCard svg{width:100%;display:block}
.gCard p{font-size:15px;line-height:1.45;margin:6px 0 0}
.gMix{font-size:15px;margin:12px 0;display:flex;align-items:center;justify-content:center;gap:4px}
.gMix .sq{width:18px;height:18px;border-radius:4px;display:inline-block}
#guideClose{font-size:18px;font-weight:700;padding:12px 40px;margin-top:4px}
</style></head><body>
<div id="root">
<div id="top">
 <div id="stat"></div>
 <div id="topBtns"><button id="mixBtn">색 조합</button><button id="guideBtn" aria-label="보석 찾는 법">?</button></div>
</div>
<div id="gemRow"></div>
<div id="boardWrap"><svg id="fld" viewBox="-0.1 -0.1 7.2 7.2"></svg><div id="toast"></div><div id="modeBar"></div></div>
<div id="bag"></div>
<div class="row" id="handRow">
 <div class="hand" id="h0"></div><div class="hand" id="h1"></div><div class="hand" id="h2"></div><div class="hand" id="h3"></div>

 <button id="bRef">바꾸기<br>(타일 1개)</button>
 <button id="bCollect">확인</button>
</div>

<div id="mixPop" class="pop"><div class="popIn"><h3>색 조합</h3><div id="mix"></div><button class="popClose">닫기</button></div></div>
<div id="pickPop" class="pop"><div class="popIn"><h3 id="pickTitle">색 고르기</h3><div id="pickList"></div><button class="popClose">닫기</button></div></div>
<div id="peekPop" class="pop"><div class="popIn"><h3>다른 색 숫자</h3><div id="peekList"></div><button class="popClose">닫기</button></div></div>

<div id="shop" class="full"><div class="fIn">
 <div class="shopHead"><span id="shopTitle">상점</span><span class="money">돈 <b id="shopMoney">0</b>원</span></div>
 <div id="shopNext" class="shopNext"></div>
 <div class="tileSlot"><div><b>타일 2개</b><span>남은 타일 <b id="shopTiles">0</b>개</span></div><button id="buyTile">1원</button></div>
 <div id="shopItems"></div>
 <div class="shopRow"><button id="reroll">진열 바꾸기 · 1원</button><button id="shopGo" class="primary">다음 구역</button></div>
 <div id="shopBag" class="shopBag"></div>
</div></div>

<div id="over" class="full"><div class="fIn center">
 <h2 id="overTitle"></h2><p id="overBody"></p><button id="retry" class="primary">다시 하기</button>
</div></div>


<div id="guide">
<div class="gIn">

<p class="gNote"><svg viewBox="0 0 1 1" width="18" height="18" style="vertical-align:-3px"><g opacity="0.85"><polygon points="0.248,0.188 0.752,0.188 0.950,0.431 0.500,0.926 0.050,0.431" fill="#E0312B" stroke="#FFFFFF" stroke-width="0.05" stroke-linejoin="round"/><path d="M0.050,0.431L0.950,0.431M0.248,0.188L0.374,0.431L0.500,0.926M0.752,0.188L0.626,0.431L0.500,0.926M0.374,0.431L0.500,0.188L0.626,0.431" fill="none" stroke="#FFFFFF" stroke-width="0.03" stroke-linejoin="round" opacity="0.7"/></g></svg> 숨은 보석 (게임에서는 안 보임)</p>
<div class="gRow">
<div class="gCard">
<svg viewBox="0 0 3.2 1.3" role="img" aria-label="노랑 타일은 오른쪽의 빨강 보석은 세지 않고 노랑 보석만 센다">

<script>
const FILL={1:'#E0312B',2:'#F2C12E',4:'#2A6FDB',3:'#F07F1A',6:'#2E9E4F',5:'#8E44AD'},INK={1:'#FFFFFF',2:'#000000',4:'#FFFFFF',3:'#000000',6:'#FFFFFF',5:'#FFFFFF'};
const NAME={1:'빨강',2:'노랑',4:'파랑',3:'주황',6:'초록',5:'보라'},PRIM=[1,2,4],MIXC=[3,6,5],ALL=[1,2,4,3,6,5];
const $=id=>document.getElementById(id),ri=n=>Math.floor(Math.random()*n),K=(x,y)=>x+','+y,LIFT=44;
const isMix=c=>MIXC.includes(c),price=c=>isMix(c)?2:1;
function gem(cx,cy,w,fill,stroke,sw,op){const h=w*0.82,t=cy-h*0.45,m=cy-h*0.12,b=cy+h*0.55,a=w*0.5,c=w*0.28,d=w*0.14;const P=(x,y)=>`${(cx+x).toFixed(3)},${y.toFixed(3)}`;
 return `<g opacity="${op==null?1:op}"><polygon points="${[P(-c,t),P(c,t),P(a,m),P(0,b),P(-a,m)].join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M${P(-a,m)}L${P(a,m)}M${P(-c,t)}L${P(-d,m)}L${P(0,b)}M${P(c,t)}L${P(d,m)}L${P(0,b)}M${P(-d,m)}L${P(0,t)}L${P(d,m)}" fill="none" stroke="${stroke}" stroke-width="${sw*0.6}" stroke-linejoin="round" opacity="0.7"/></g>`;}
const dia=(x,y,i)=>`${x+0.5},${y+i} ${x+1-i},${y+0.5} ${x+0.5},${y+1-i} ${x+i},${y+0.5}`;

// ---------- 구역표 ----------
const STAGES=[
 {c:[1],n:1,tag:'시작'},{c:[1],n:2,tag:'보석이 하나 늘어남'},
 {c:[1,2],n:2,nc:2,tag:'새 색 노랑'},{c:[1,2],n:3,tag:'보석이 하나 늘어남'},{c:[1,2],n:3,tag:'같은 수준, 다른 판'},
 {c:[1,2,4],n:3,nc:4,tag:'새 색 파랑'},{c:[1,2,4],n:4,tag:'보석이 하나 늘어남'},{c:[1,2,4],n:3,tag:'쉬어 가는 구역'},
 {c:[3],n:2,nc:3,tag:'새 색 주황 · 주황 보석만'},{c:[1,2,4,3],n:4,m:1,tag:'색이 하나 늘어남'},{c:[1,2,4,3],n:4,m:1,tag:'같은 수준, 다른 판'},{c:[1,2,4,3],n:5,m:1,tag:'보석이 하나 늘어남'},{c:[1,2,4,3],n:4,tag:'쉬어 가는 구역'},
 {c:[6],n:2,nc:6,tag:'새 색 초록 · 초록 보석만'},{c:[1,2,4,6],n:5,m:1,tag:'색이 하나 늘어남'},{c:[1,3,4,6],n:5,m:2,tag:'섞은 색 보석이 늘어남'},{c:[1,2,4,6],n:4,m:1,tag:'쉬어 가는 구역'},
 {c:[5],n:2,nc:5,tag:'새 색 보라 · 보라 보석만'},{c:[1,2,4,5],n:5,m:1,tag:'색이 하나 늘어남'},{c:[3,6,5],n:5,tag:'섞은 색 보석만'},{c:[1,3,6,5],n:6,m:2,tag:'섞은 색 보석이 늘어남'},{c:[1,2,4,3],n:5,m:1,tag:'쉬어 가는 구역'},
 {c:[2,3,6,5],n:7,m:2,tag:'보석이 하나 늘어남'},{c:[3,6,5],n:6,tag:'섞은 색 보석만'},{c:[2,4,6,3],n:8,m:3,tag:'보석이 늘어남'},{c:[1,2,4,5],n:6,m:2,tag:'쉬어 가는 구역'}];
function spec(z){if(z<=STAGES.length){const t=STAGES[z-1];return {c:t.c,n:t.n,nc:t.nc||0,m:t.m||0,tag:t.tag};}
 const k=z-STAGES.length,cy=Math.floor((k-1)/4),pos=(k-1)%4,n=Math.min(10,6+cy+[1,1,2,0][pos]);
 if(pos===1&&cy%2===0)return {c:[3,6,5],n:Math.min(9,n),nc:0,m:0,tag:'섞은 색 보석만'};
 const pool=[...ALL];const c=[];while(c.length<4)c.push(pool.splice(ri(pool.length),1)[0]);
 return {c:ALL.filter(x=>c.includes(x)),n,nc:0,m:Math.min(n-1,2+cy+[0,1,1,0][pos]),tag:pos===3?'쉬어 가는 구역':'보석이 늘어남'};}
const pw=z=>z<=10?1:z<=15?1.5:2;

// ---------- 아이템 ----------
const ITEMS={
 pick:{nm:'색 골라 받기',ds:'손의 타일 한 장을 원하는 색으로 바꾼다',p:1,k:'hold'},
 peek:{nm:'숫자 다시 보기',ds:'다음 구역 동안 판의 타일을 눌러 다른 색 숫자를 3번 볼 수 있다',p:2,k:'next'},
 row:{nm:'줄 탐지',ds:'다음 구역 시작 때 가로 한 줄을 골라 그 줄의 보석 수를 본다',p:3,k:'next'},
 area:{nm:'색 탐지',ds:'한 색을 골라 그 색 보석 하나가 있는 3×3 구역을 표시한다',p:4,k:'hold'},
 freeov:{nm:'겹치기 공짜',ds:'다음 구역에서는 타일 위에 겹쳐 놓아도 남은 타일이 줄지 않는다',p:3,k:'next'},
 value:{nm:'섞은 보석 값 +1',ds:'섞은 색 보석을 팔 때 1원씩 더 받는다',p:5,k:'perm'},
 bonus:{nm:'찾으면 타일 +1',ds:'앞으로 5구역 동안 보석을 찾으면 타일을 1개 더 받는다',p:8,k:'span'},
 hand4:{nm:'네 번째 손',ds:'손에 드는 타일이 4장이 된다',p:10,k:'perm'},
 lucky:{nm:'행운의 손',ds:'다음 구역 동안 남은 보석 색 타일이 두 배 자주 나온다',p:2,k:'next'},
 small:{nm:'좁은 판',ds:'다음 구역 판이 6×6이 된다',p:7,k:'next'},
 double:{nm:'보석 두 배 구역',ds:'다음 구역 보석이 2개 더 나오고, 그 구역 보석은 두 배 값에 판다',p:1,k:'next'},
 probe:{nm:'탐지기 3회',ds:'칸을 눌러 그 칸에 보석이 있는지 본다(3번)',p:5,k:'hold'}};
const KTAG={hold:'가방',next:'다음 구역',perm:'계속',span:'5구역'};

// ---------- 상태 ----------
let G=7,zone=1,tiles=10,money=0,best=0,gems=[],cell={},hand=[0,0,0],hs=0,HN=3,phase='play',drag=null,target=null,selCell=null,reveal=false;
let bag=[],perm={},spanLeft=0,nextFx={},fx={},marks={},rowMarks={},areaMark=null,mode=null,collected=false,collecting=false,shop=null,flash=[],vanish=[];
try{best=+(localStorage.getItem('ms2_best')||0)}catch(e){}
const live=()=>gems.filter(g=>!g.f),done=()=>gems.filter(g=>g.f);
function clue(x,y,t){const L=live().filter(g=>g.c===t);return{l:L.filter(g=>g.x<x).length,r:L.filter(g=>g.x>x).length,u:L.filter(g=>g.y<y).length,d:L.filter(g=>g.y>y).length};}
function poolList(){const S=new Set();for(const g of live()){S.add(g.c);if(isMix(g.c))for(const p of PRIM)if(g.c&p)S.add(p);}return [...S];}
function draw1(){const cs=poolList();if(!cs.length)return 0;const gc=new Set(live().map(g=>g.c));
 const w=cs.map(c=>(PRIM.includes(c)&&!gc.has(c)?pw(zone):1)*(fx.lucky&&gc.has(c)?2:1));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<cs.length;i++){r-=w[i];if(r<0)return cs[i];}return cs[cs.length-1];}
function result(t,h){if(t&h)return 0;const u=t|h;return u===7?0:u;}

// ---------- 그리기 ----------
function tileSvg(x,y,t,ring){const c=clue(x,y,t),ink=INK[t],cx=x+0.5,cy=y+0.5,d=0.27,fs=0.23;
 let s=`<polygon points="${dia(x,y,0.02)}" fill="${FILL[t]}" stroke="${ring?'#FFFFFF':'none'}" stroke-width="0.07" stroke-linejoin="round"/>`;if(ring)return s;
 for(const [k,dx,dy] of [['u',0,-1],['d',0,1],['l',-1,0],['r',1,0]])s+=`<text x="${cx+dx*d}" y="${cy+dy*d}" font-size="${fs}" fill="${ink}" text-anchor="middle" dominant-baseline="central" style="font-weight:700">${c[k]}</text>`;return s;}
function draw(){
 const f=$('fld');f.setAttribute('viewBox',`-0.1 -0.1 ${G+0.2} ${G+0.2}`);
 const vc=drag&&drag.c?drag.c:(selCell&&cell[selCell]?cell[selCell]:hand[hs]);
 let s=`<rect x="0" y="0" width="${G}" height="${G}" rx="0.08" fill="#141414"/>`;
 for(let i=1;i<G;i++)s+=`<line x1="${i}" y1="0" x2="${i}" y2="${G}" stroke="#3A3A3A" stroke-width="0.02"/><line x1="0" y1="${i}" x2="${G}" y2="${i}" stroke="#3A3A3A" stroke-width="0.02"/>`;
 if(areaMark)s+=`<rect x="${areaMark.x}" y="${areaMark.y}" width="3" height="3" fill="${FILL[areaMark.c]}" opacity="0.22" stroke="${FILL[areaMark.c]}" stroke-width="0.05" stroke-dasharray="0.15 0.1"/>`;
 let dim='';for(const [k,t] of Object.entries(cell)){if(t!==vc)continue;const [x,y]=k.split(',').map(Number),c=clue(x,y,t);
  if(c.l===0)dim+=`<rect x="0" y="0" width="${x}" height="${G}"/>`;if(c.r===0)dim+=`<rect x="${x+1}" y="0" width="${G-x-1}" height="${G}"/>`;
  if(c.u===0)dim+=`<rect x="0" y="0" width="${G}" height="${y}"/>`;if(c.d===0)dim+=`<rect x="0" y="${y+1}" width="${G}" height="${G-y-1}"/>`;}
 s+=`<g opacity="0.55" fill="#000000">${dim}</g>`;
 for(const [k,t] of Object.entries(cell))if(t===vc){const [x,y]=k.split(',').map(Number);s+=`<line x1="0" y1="${y+0.5}" x2="${G}" y2="${y+0.5}" stroke="${FILL[t]}" stroke-width="0.03" stroke-dasharray="0.1 0.08"/><line x1="${x+0.5}" y1="0" x2="${x+0.5}" y2="${G}" stroke="${FILL[t]}" stroke-width="0.03" stroke-dasharray="0.1 0.08"/>`;}
 for(const [r,n] of Object.entries(rowMarks))s+=`<rect x="0" y="${+r}" width="${G}" height="1" fill="none" stroke="#85B7EB" stroke-width="0.05"/><circle cx="-0.0" cy="${+r+0.5}" r="0.28" fill="#2A6FDB"/><text x="0" y="${+r+0.5}" font-size="0.32" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" style="font-weight:700">${n}</text>`;
 for(const [k,t] of Object.entries(cell)){const [x,y]=k.split(',').map(Number);s+=tileSvg(x,y,t,false);}
 for(const v of vanish)s+=tileSvg(v.x,v.y,v.t,true);
 for(const [k,v] of Object.entries(marks)){if(cell[k])continue;const [x,y]=k.split(',').map(Number);s+=v?gem(x+0.5,y+0.52,0.5,'none','#FFFFFF',0.05):`<path d="M${x+0.3},${y+0.3}L${x+0.7},${y+0.7}M${x+0.7},${y+0.3}L${x+0.3},${y+0.7}" stroke="#888780" stroke-width="0.06"/>`;}
 if(selCell&&cell[selCell]&&!drag){const [x,y]=selCell.split(',').map(Number);s+=`<polygon points="${dia(x,y,-0.04)}" fill="none" stroke="#FFFFFF" stroke-width="0.07"/>`;}
 for(const g of done()){if(phase==='clear'){if(!g.col)s+=gem(g.x+0.5,g.y+0.52,0.74,FILL[g.c],'#FFFFFF',0.045);}else s+=gem(g.x+0.5,g.y+0.5,0.36,'#FFFFFF','rgba(0,0,0,0.6)',0.03);}
 for(const g of flash)s+=gem(g.x+0.5,g.y+0.5,0.86,'none','#FFFFFF',0.06);
 if(reveal||phase==='lost')for(const g of live())s+=gem(g.x+0.5,g.y+0.52,0.66,FILL[g.c],'#FFFFFF',0.04,0.8);
 if(drag&&drag.er&&target){const has=!!cell[K(target.x,target.y)];s+=`<polygon points="${dia(target.x,target.y,0)}" fill="#000000" fill-opacity="${has?0.9:0.2}" stroke="${has?'#FFFFFF':'#E0312B'}" stroke-width="0.07"/>`;}
 if(drag&&drag.c&&target){const r=result(cell[K(target.x,target.y)]||0,drag.c);
  s+=`<line x1="0" y1="${target.y+0.5}" x2="${G}" y2="${target.y+0.5}" stroke="${FILL[drag.c]}" stroke-width="0.03" stroke-dasharray="0.1 0.08"/><line x1="${target.x+0.5}" y1="0" x2="${target.x+0.5}" y2="${G}" stroke="${FILL[drag.c]}" stroke-width="0.03" stroke-dasharray="0.1 0.08"/>`;
  s+=`<polygon points="${dia(target.x,target.y,0)}" fill="${r?FILL[r]:'#000000'}" fill-opacity="${r?0.5:0.9}" stroke="#FFFFFF" stroke-width="0.07"/>`;}
 f.innerHTML=s;
 // 위 정보
 $('stat').innerHTML=`<span>${zone}구역</span><span>남은 타일 <b>${tiles}</b></span><span>돈 <b id="moneyNum">${money}</b>원</span><span class="muted">최고 ${best}구역</span>`;
 const order=[...gems].sort((a,b)=>ALL.indexOf(a.c)-ALL.indexOf(b.c)||(b.f-a.f));
 $('gemRow').innerHTML=order.map(g=>`<svg viewBox="0 0 1 1" class="gIco">${g.f?gem(0.5,0.52,0.9,FILL[g.c],'#FFFFFF',0.05):gem(0.5,0.52,0.88,'none',FILL[g.c],0.08)}</svg>`).join('')+`<span class="gCnt"><b>${done().length}</b> / ${gems.length}</span>`;
 // 손
 for(let i=0;i<4;i++){const b=$('h'+i),c=hand[i];b.style.display=phase==='play'&&i<HN?'flex':'none';b.innerHTML=c?`<svg viewBox="0 0 1 1" class="hdia"><polygon points="0.5,0.03 0.97,0.5 0.5,0.97 0.03,0.5" fill="${FILL[c]}"/></svg><span style="color:${INK[c]}">${NAME[c]}</span>`:'';b.classList.toggle('on',hs===i&&!(selCell&&cell[selCell]));b.style.opacity=drag&&drag.i===i?0.35:1;}
 $('er').style.display=phase==='play'?'flex':'none';$('er').style.opacity=drag&&drag.er?0.35:1;
 $('bRef').style.display=phase==='play'?'':'none';
 $('bCollect').style.display=phase==='clear'&&!collected?'':'none';$('bCollect').disabled=collecting;
 // 가방과 효과
 let bg=bag.map((it,i)=>`<button class="chip" data-bag="${i}">${it.id==='probe'?`탐지기 ${it.uses}회`:ITEMS[it.id].nm}</button>`).join('');
 const ef=[];if(fx.freeov)ef.push('겹치기 공짜');if(fx.lucky)ef.push('행운의 손');if(fx.double)ef.push('보석 두 배');if(fx.small)ef.push('좁은 판');if(fx.peek)ef.push('숫자 다시 보기 '+fx.peek+'회');if(spanLeft)ef.push('찾으면 +1 ('+spanLeft+'구역)');if(perm.value)ef.push('섞은 보석 +1원');
 bg+=ef.map(e=>`<span class="eff">${e}</span>`).join('');$('bag').innerHTML=phase==='play'?bg:'';
 document.querySelectorAll('[data-bag]').forEach(b=>b.onclick=()=>useBag(+b.dataset.bag));
 $('modeBar').style.display=mode?'block':'none';$('modeBar').textContent=mode==='probe'?'탐지할 칸을 누르세요':mode==='row'?'보석 수를 볼 가로줄의 칸을 누르세요':'';}
let toastT=0;function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1500);}

// ---------- 구역 ----------
function startZone(){const sp=spec(zone);G=fx.small?6:7;const n=Math.min(sp.n+(fx.double?2:0),G*G-1);
 const P=sp.c,MX=P.filter(isMix),used=new Set();gems=[];
 while(gems.length<n){const x=ri(G),y=ri(G);if(used.has(K(x,y)))continue;used.add(K(x,y));gems.push({x,y,c:(gems.length===0&&sp.nc)?sp.nc:P[ri(P.length)],f:false,lock:gems.length===0&&!!sp.nc});}
 if(MX.length){let cnt=gems.filter(g=>isMix(g.c)).length;const cand=gems.filter(g=>!g.lock&&PRIM.includes(g.c));while(cnt<sp.m&&cand.length){cand.splice(ri(cand.length),1)[0].c=MX[ri(MX.length)];cnt++;}}
 cell={};marks={};rowMarks={};areaMark=null;selCell=null;flash=[];vanish=[];phase='play';collected=false;collecting=false;reveal=false;
 HN=perm.hand4?4:3;hand=Array.from({length:4},draw1);hs=0;mode=fx.row?'row':null;
 draw();fit();toast(`${zone}구역<br><span style="font-size:17px;font-weight:400">${zone===1?'숫자를 보고 보석을 찾으세요':sp.tag}</span>`);}
function newGame(){zone=1;tiles=10;money=0;bag=[];perm={};spanLeft=0;nextFx={};fx={};$('over').classList.remove('show');$('shop').classList.remove('show');startZone();}
function afterPlace(foundG){
 if(live().length){const pool=new Set(poolList());hand=hand.map(c=>c&&!pool.has(c)?draw1():c);}
 if(live().length===0){phase='clear';for(const [k,t] of Object.entries(cell)){const [a,b]=k.split(',').map(Number);vanish.push({x:a,y:b,t});}cell={};marks={};rowMarks={};areaMark=null;mode=null;
  setTimeout(()=>toast(`${zone}구역 클리어!<br><span style="font-size:17px;font-weight:400">확인을 눌러 보석을 파세요</span>`),300);}
 else if(tiles<=0)lose();
 draw();setTimeout(()=>{flash=[];vanish=[];draw();},1200);}
function lose(){phase='lost';if(zone>best){best=zone;try{localStorage.setItem('ms2_best',String(best))}catch(e){}}draw();
 setTimeout(()=>{$('overTitle').textContent=`${zone}구역에서 끝났습니다`;$('overBody').innerHTML=`남은 타일이 바닥났습니다.<br>최고 기록 ${best}구역`;$('over').classList.add('show');},1400);}
function placeAt(x,y,i){const h=hand[i],k=K(x,y),t=cell[k]||0;selCell=null;
 const nt=result(t,h),g=gems.find(q=>!q.f&&q.x===x&&q.y===y);flash=[];
 if(nt&&g&&g.c===nt){g.f=true;cell[k]=nt;const add=1+(spanLeft?1:0);tiles+=add;flash=[g];toast(`${NAME[nt]} 보석 발견!<br><span style="font-size:17px;font-weight:400">타일 +${add}</span>`);}
 else{if(!(t&&fx.freeov))tiles--;if(nt)cell[k]=nt;else delete cell[k];}
 hand[i]=draw1();hs=i;afterPlace(g&&g.f);}
function eraseAt(x,y){const k=K(x,y);if(!cell[k]){toast('빈 칸에는 지우개를 놓을 수 없어요');return;}selCell=null;delete cell[k];tiles--;afterPlace(false);}

// ---------- 보석 팔기 ----------
function collect(){if(collecting||collected)return;collecting=true;draw();const list=done().filter(g=>!g.col),root=$('root'),rr=root.getBoundingClientRect();let i=0,earned=0;
 const step=()=>{if(i>=list.length){setTimeout(()=>{collecting=false;collected=true;draw();toast(`보석 ${list.length}개를 팔았습니다<br>+${earned}원`);setTimeout(openShop,1200);},420);return;}
  const g=list[i++],v=(price(g.c)+(perm.value&&isMix(g.c)?1:0))*(fx.double?2:1);earned+=v;
  const fr=$('fld').getBoundingClientRect(),u=fr.width/(G+0.2),sx=fr.left+(g.x+0.6)*u-rr.left,sy=fr.top+(g.y+0.6)*u-rr.top,sc=$('moneyNum').getBoundingClientRect(),tx=sc.left+sc.width/2-rr.left,ty=sc.top+sc.height/2-rr.top,w=u*0.74;
  g.col=true;draw();const f=document.createElement('div');f.className='fly';f.style.cssText=`width:${w}px;height:${w}px;left:${sx-w/2}px;top:${sy-w/2}px`;f.innerHTML=`<svg viewBox="0 0 1 1" width="100%" height="100%">${gem(0.5,0.52,1,FILL[g.c],'#FFFFFF',0.06)}</svg>`;root.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(0.35)`;f.style.opacity='0.9';}));
  setTimeout(()=>{f.remove();money+=v;draw();const n=$('moneyNum');n.classList.add('bump');},520);setTimeout(step,260);};
 step();}

// ---------- 상점 ----------
function offerList(){const ok=Object.keys(ITEMS).filter(id=>!(ITEMS[id].k==='perm'&&perm[id])&&!(id==='bonus'&&spanLeft));const r=[];while(r.length<3&&ok.length)r.push(ok.splice(ri(ok.length),1)[0]);return r;}
function openShop(){shop={items:offerList(),bought:null,rr:0};renderShop();$('shop').classList.add('show');}
function renderShop(){const nx=spec(zone+1);$('shopTitle').textContent=`${zone}구역 끝 · 상점`;$('shopMoney').textContent=money;$('shopTiles').textContent=tiles;
 $('shopNext').textContent=`다음: ${zone+1}구역 · ${nx.tag} · 보석 ${nx.n}개`;
 $('buyTile').disabled=money<1;
 $('shopItems').innerHTML=shop.items.map((id,i)=>{const it=ITEMS[id],sold=shop.bought!==null;const full=it.k==='hold'&&bag.length>=3;
  const dis=sold||money<it.p||full;return `<div class="item${shop.bought===i?' sold':''}"><div class="txt"><div class="nm">${it.nm}<span class="tag">${KTAG[it.k]}</span></div><div class="ds">${it.ds}${full&&!sold?' (가방이 가득 참)':''}</div></div><button data-buy="${i}" ${dis?'disabled':''}>${shop.bought===i?'샀음':it.p+'원'}</button></div>`;}).join('');
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy));
 const cost=shop.rr+1;$('reroll').textContent=`진열 바꾸기 · ${cost}원`;$('reroll').disabled=money<cost||shop.bought!==null;
 const nf=Object.keys(nextFx).map(k=>ITEMS[k].nm);$('shopBag').innerHTML=`가방(${bag.length}/3): ${bag.length?bag.map(b=>ITEMS[b.id].nm+(b.uses?` ${b.uses}회`:'')).join(', '):'비어 있음'}`+(nf.length?`<br>다음 구역에 쓸 것: ${nf.join(', ')}`:'')+(Object.keys(perm).length?`<br>계속 효과: ${Object.keys(perm).map(k=>ITEMS[k].nm).join(', ')}`:'')+(spanLeft?`<br>찾으면 타일 +1: ${spanLeft}구역 남음`:'');}
function buy(i){const id=shop.items[i],it=ITEMS[id];if(shop.bought!==null||money<it.p)return;money-=it.p;shop.bought=i;
 if(it.k==='hold')bag.push({id,uses:id==='probe'?3:0});else if(it.k==='next')nextFx[id]=true;else if(it.k==='perm')perm[id]=true;else if(it.k==='span')spanLeft=6;renderShop();}
$('buyTile').onclick=()=>{if(money<1)return;money--;tiles+=2;renderShop();};
$('reroll').onclick=()=>{const cost=shop.rr+1;if(money<cost||shop.bought!==null)return;money-=cost;shop.rr++;shop.items=offerList();renderShop();};
$('shopGo').onclick=()=>{$('shop').classList.remove('show');if(spanLeft)spanLeft--;fx={...nextFx};if(fx.peek)fx.peek=3;nextFx={};zone++;startZone();};

// ---------- 가방 사용 ----------
function picker(title,colors,cb){$('pickTitle').textContent=title;$('pickList').innerHTML=colors.map(c=>`<button class="pickC" data-pc="${c}" style="background:${FILL[c]};color:${INK[c]}">${NAME[c]}</button>`).join('');
 document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{$('pickPop').classList.remove('show');cb(+b.dataset.pc);});$('pickPop').classList.add('show');}
function useBag(i){const it=bag[i];if(phase!=='play')return;
 if(it.id==='pick')picker('손의 고른 타일을 이 색으로',poolList().length?ALL.filter(c=>poolList().includes(c)):ALL,c=>{hand[hs]=c;bag.splice(i,1);draw();});
 else if(it.id==='area'){const cs=ALL.filter(c=>live().some(g=>g.c===c));picker('어느 색 보석을 찾을까요',cs,c=>{const L=live().filter(g=>g.c===c),g=L[ri(L.length)];const x=Math.max(0,Math.min(G-3,g.x-ri(3))),y=Math.max(0,Math.min(G-3,g.y-ri(3)));areaMark={x,y,c};bag.splice(i,1);draw();toast(`${NAME[c]} 보석 하나가<br>표시한 구역 안에 있습니다`);});}
 else if(it.id==='probe'){mode='probe';draw();}}
function boardTap(x,y){const k=K(x,y);
 if(mode==='probe'){const i=bag.findIndex(b=>b.id==='probe');if(i<0){mode=null;draw();return;}marks[k]=gems.some(g=>!g.f&&g.x===x&&g.y===y);bag[i].uses--;if(!bag[i].uses)bag.splice(i,1);mode=null;toast(marks[k]?'이 칸에 보석이 있습니다':'이 칸은 비어 있습니다');draw();return;}
 if(mode==='row'){rowMarks[y]=live().filter(g=>g.y===y).length;mode=null;fx.row=false;toast(`이 줄에 보석 ${rowMarks[y]}개`);draw();return;}
 if(fx.peek&&cell[k]){const cs=ALL.filter(c=>c!==cell[k]&&(live().some(g=>g.c===c)));$('peekList').innerHTML=cs.length?cs.map(c=>{const v=clue(x,y,c);return `<div class="peekRow"><span class="sq" style="background:${FILL[c]}"></span>위 ${v.u} · 아래 ${v.d} · 왼쪽 ${v.l} · 오른쪽 ${v.r}</div>`;}).join(''):'다른 색 보석이 없습니다';fx.peek--;$('peekPop').classList.add('show');draw();return;}
 selCell=cell[k]&&selCell!==k?k:null;draw();}

// ---------- 끌기 ----------
function cellAt(cx,cy){const pt=$('fld').createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform($('fld').getScreenCTM().inverse());if(p.x<0||p.y<0||p.x>=G||p.y>=G)return null;return {x:Math.floor(p.x),y:Math.floor(p.y)};}
function moveGhost(e){const top=$('handRow').getBoundingClientRect().top;const lift=e.clientY>=top-4?0:LIFT;const r=$('root').getBoundingClientRect(),gh=$('ghost');gh.style.left=(e.clientX-r.left-30)+'px';gh.style.top=(e.clientY-r.top-30-lift)+'px';
 if(!drag.mv&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>14)drag.mv=true;target=(drag.mv&&e.clientY<top)?cellAt(e.clientX,e.clientY-lift):null;draw();}
function startDrag(el,e,d,bgc,txt,inkc){if(phase!=='play'||mode)return;e.preventDefault();el.setPointerCapture(e.pointerId);drag={...d,sx:e.clientX,sy:e.clientY,mv:false};const gh=$('ghost');gh.style.display='flex';gh.style.background=bgc;gh.style.color=inkc;gh.textContent=txt;moveGhost(e);}
function endDrag(fn){if(!drag)return;const d=drag,t=target;drag=null;target=null;$('ghost').style.display='none';if(t)fn(d,t);else draw();}
for(let i=0;i<4;i++){const el=$('h'+i);
 el.addEventListener('pointerdown',e=>{if(!hand[i])return;hs=i;selCell=null;startDrag(el,e,{i,c:hand[i]},FILL[hand[i]],NAME[hand[i]],INK[hand[i]]);});
 el.addEventListener('pointermove',e=>{if(drag)moveGhost(e);});el.addEventListener('pointerup',()=>endDrag((d,t)=>placeAt(t.x,t.y,d.i)));
 el.addEventListener('pointercancel',()=>{drag=null;target=null;$('ghost').style.display='none';draw();});el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});}
{const el=$('er');el.addEventListener('pointerdown',e=>startDrag(el,e,{er:true},'#141414','지우개','#FFFFFF'));el.addEventListener('pointermove',e=>{if(drag)moveGhost(e);});
 el.addEventListener('pointerup',()=>endDrag((d,t)=>eraseAt(t.x,t.y)));el.addEventListener('pointercancel',()=>{drag=null;target=null;$('ghost').style.display='none';draw();});el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});}
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault();},{passive:false});
$('fld').addEventListener('click',e=>{if(phase!=='play')return;const c=cellAt(e.clientX,e.clientY);if(c)boardTap(c.x,c.y);});
$('bRef').onclick=()=>{if(phase!=='play')return;tiles--;hand=Array.from({length:4},draw1);hs=0;if(tiles<=0&&live().length)lose();draw();};
$('bCollect').onclick=collect;$('retry').onclick=newGame;

// ---------- 팝업, 가이드 ----------
const sq=c=>`<span class="sq" style="background:${FILL[c]}"></span>`;
$('mix').innerHTML=[[1,2,3],[2,4,6],[1,4,5]].map(([a,b,r])=>`<div class="mx">${sq(a)}+${sq(b)}=${sq(r)}</div>`).join('');
document.querySelectorAll('.pop').forEach(p=>p.addEventListener('click',e=>{if(e.target===p||e.target.classList.contains('popClose'))p.classList.remove('show');}));
$('mixBtn').onclick=()=>$('mixPop').classList.add('show');
function guide(on){$('guide').classList.toggle('show',on);}
$('guideBtn').onclick=()=>guide(true);$('guideClose').onclick=()=>{guide(false);try{localStorage.setItem('ms2_guide','1')}catch(e){}};
try{if(!localStorage.getItem('ms2_guide'))guide(true);}catch(e){guide(true);}

// ---------- 시험 도구 (?dev) ----------
if(location.search.indexOf('dev')>=0){document.body.classList.add('dev');$('devTools').style.display='block';
 for(let z=1;z<=30;z++){const b=document.createElement('button');b.textContent=z;b.onclick=()=>{zone=z;startZone();};$('zbs').appendChild(b);}
 $('dMoney').onclick=()=>{money+=10;draw();};$('dTiles').onclick=()=>{tiles+=5;draw();};$('dShow').onclick=()=>{reveal=!reveal;draw();};$('dShop').onclick=openShop;}

function fit(){const w=$('boardWrap'),sz=Math.max(120,Math.floor(Math.min(w.clientWidth,w.clientHeight)));$('fld').style.width=sz+'px';$('fld').style.height=sz+'px';}
window.addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
newGame();setTimeout(fit,300);

</script></body></html>
